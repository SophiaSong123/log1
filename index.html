<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人网页</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --accent-color: #6366f1;
            --card-bg: #f8fafc;
            --border-color: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --text-color: #f1f5f9;
            --accent-color: #818cf8;
            --card-bg: #1e293b;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.3s ease;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 60px;
        }

        .theme-toggle {
            background: none;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background-color: var(--accent-color);
            color: white;
        }

        .hero {
            text-align: center;
            margin-bottom: 60px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: var(--accent-color);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.8;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill-tag {
            background-color: var(--accent-color);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
        }

        .contact-links {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .contact-links a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
            opacity: 0.7;
        }

        .article-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .article-date {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div></div>
            <button class="theme-toggle" id="themeToggle">切换主题</button>
        </header>

        <section class="hero">
            <div class="avatar">S</div>
            <h1>Sophia Song</h1>
            <p class="subtitle">热爱生活、喜欢AI的专业咨询顾问</p>
        </section>

        <section class="card">
            <h2>关于我</h2>
            <p>热爱技术，喜欢简洁的设计理念，追求极致的用户体验。专注于前端开发，同时对交互设计和用户研究也有浓厚的兴趣。</p>
        </section>

        <section class="card">
            <h2>端午佳节</h2>
            <p class="article-date">2026年6月20日</p>
            <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=800&h=400&fit=crop" alt="端午节" class="article-image">
            <p>端午节是中国传统节日，纪念爱国诗人屈原。这一天，人们赛龙舟、吃粽子，传承千年的民俗文化。粽叶飘香，龙舟竞渡，承载着深厚的家国情怀。</p>
        </section>

        <section class="card">
            <h2>联系我</h2>
            <p>如果你有任何想法或合作意向，欢迎随时联系我！</p>
            <div class="contact-links">
                <a href="mailto:example@email.com">Email</a>
                <a href="#">GitHub</a>
                <a href="#">LinkedIn</a>
            </div>
        </section>

        <footer>
            <p>&copy; 2026 Sophia Song. All rights reserved.</p>
        </footer>
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            html.setAttribute('data-theme', savedTheme);
            updateButtonText(savedTheme);
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? '' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateButtonText(newTheme);
        });

        function updateButtonText(theme) {
            themeToggle.textContent = theme === 'dark' ? '切换到白天' : '切换到黑夜';
        }
    </script>
</body>
</html>
